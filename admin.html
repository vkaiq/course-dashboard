<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة رفع المحتوى والملفات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white p-8">

  <div class="max-w-2xl mx-auto space-y-8">
    
    <!-- نموذج رفع الإعلانات والواجبات -->
    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-4">
      <h2 class="text-xl font-bold border-b border-gray-700 pb-2">إضافة واجب / إعلان</h2>
      
      <div>
        <label class="block text-sm mb-1">القسم</label>
        <select id="section-type" class="w-full bg-gray-700 p-2 rounded text-white">
          <option value="assignments">الواجبات</option>
          <option value="announcements_1">إعلانات الدورة (العمود الأول)</option>
          <option value="announcements_2">إعلانات الدورة (العمود الثاني)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm mb-1">العنوان</label>
        <input type="text" id="item-title" class="w-full bg-gray-700 p-2 rounded text-white">
      </div>

      <div>
        <label class="block text-sm mb-1">التفاصيل / النص</label>
        <textarea id="item-content" class="w-full bg-gray-700 p-2 rounded text-white h-20"></textarea>
      </div>

      <div>
        <label class="block text-sm mb-1">المرفق (اختر ملف)</label>
        <input type="file" id="item-file" class="w-full bg-gray-700 p-2 rounded text-white">
      </div>

      <button onclick="uploadItem()" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded font-bold">رفع ونشر</button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function uploadItem() {
      const section = document.getElementById('section-type').value;
      const title = document.getElementById('item-title').value;
      const content = document.getElementById('item-content').value;
      const fileInput = document.getElementById('item-file').files[0];

      if (!title) return alert('يرجى كتابة العنوان');

      let fileUrl = null;

      // 1. رفع الملف إلى Storage إذا وجد
      if (fileInput) {
        const filePath = `uploads/${Date.now()}_${fileInput.name}`;
        const { data, error: uploadError } = await supabase.storage
          .from('course-files')
          .upload(filePath, fileInput);

        if (uploadError) return alert('فشل رفع الملف: ' + uploadError.message);

        const { data: publicUrlData } = supabase.storage
          .from('course-files')
          .getPublicUrl(filePath);

        fileUrl = publicUrlData.publicUrl;
      }

      // 2. إدخال السجل في Database
      const { error: dbError } = await supabase.from('dashboard_items').insert([{
        section_type: section,
        title: title,
        content: content,
        file_url: fileUrl
      }]);

      if (dbError) {
        alert('حدث خطأ أثناء الحفظ: ' + dbError.message);
      } else {
        alert('تم الرفع والنشر بنجاح!');
        location.reload();
      }
    }
  </script>
</body>
</html>
