<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيلات الدورة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #333333; color: #ffffff; }
    .custom-card { background-color: #4a4a4a; border: 2px solid #222222; border-radius: 1rem; }
    .inner-card { background-color: #555555; border: 1.5px solid #2b2b2b; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <div class="custom-card p-6 space-y-6">
      <div class="bg-[#3b3b3b] text-center py-3 px-6 rounded-full font-bold text-xl border border-gray-600">
        تسجيل الدورة
      </div>

      <div id="course-content-container" class="space-y-4">
        <div class="inner-card p-6 text-center text-gray-400 text-sm">جاري تحميل تسجيلات الدورة...</div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://fyhowaxmmsmflwdiubfs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7h5Md1GNOmy2IDwe2_vvgQ_8641PjaP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const arabicNumbers = {
      1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع', 5: 'الخامس', 6: 'السادس',
      7: 'السابع', 8: 'الثامن', 9: 'التاسع', 10: 'العاشر', 11: 'الحادي عشر', 12: 'الثاني عشر',
      13: 'الثالث عشر', 14: 'الرابع عشر', 15: 'الخامس عشر', 16: 'السادس عشر', 17: 'السابع عشر', 18: 'الثامن عشر'
    };

    function getWeekLabel(num) {
      return arabicNumbers[num] ? `الأسبوع ${arabicNumbers[num]}` : `الأسبوع ${num}`;
    }

    async function loadCourseContent() {
      const container = document.getElementById('course-content-container');

      const { data: weekly, error } = await supabaseClient
        .from('weekly_content')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        container.innerHTML = `<div class="inner-card p-4 text-center text-red-400 text-sm">خطأ في تحميل البيانات: ${error.message}</div>`;
        return;
      }

      if (!weekly || weekly.length === 0) {
        container.innerHTML = `<div class="inner-card p-6 text-center text-gray-400 text-sm">لا توجد تسجيلات متاحة حتى الآن</div>`;
        return;
      }

      let weeksMap = {};
      weekly.forEach(item => {
        let wNum = item.week_number || 1;
        if (!weeksMap[wNum]) weeksMap[wNum] = [];
        weeksMap[wNum].push(item);
      });

      let html = '';

      Object.keys(weeksMap).sort((a, b) => a - b).forEach(wNum => {
        const weekName = getWeekLabel(wNum);
        const lectures = weeksMap[wNum];

        html += `
          <div class="inner-card p-4 space-y-4 border border-gray-600">
            <div class="font-bold text-yellow-400 text-lg border-b border-gray-600 pb-2 flex justify-between items-center">
              <span>📅 ${weekName}</span>
              <span class="text-xs bg-gray-600 px-2.5 py-1 rounded text-white">${lectures.length} محاضرات</span>
            </div>
            <div class="space-y-3">
        `;

        lectures.forEach((lecture) => {
          html += `
            <div class="bg-[#3b3b3b] p-4 rounded-lg space-y-3 border border-gray-700">
              <div class="flex justify-between items-center flex-wrap gap-2">
                <span class="font-bold text-base text-yellow-300">${lecture.title || '(بدون عنوان)'}</span>
              </div>
          `;

          if (lecture.description) {
            html += `<p class="text-sm text-gray-200 leading-relaxed">${lecture.description}</p>`;
          }

          if (lecture.video_url) {
            html += `
              <div class="pt-2">
                <a href="${lecture.video_url}" target="_blank" class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition">
                  مشاهدة الفيديو 🎥
                </a>
              </div>
            `;
          }

          if (lecture.file_url) {
            html += `
              <div class="pt-1">
                <a href="${lecture.file_url}" target="_blank" class="inline-block bg-green-600 hover:bg-green-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition">
                  تحميل المرفق / الملف 📎
                </a>
              </div>
            `;
          }

          html += `</div>`;
        });

        html += `</div></div>`;
      });

      container.innerHTML = html;
    }

    loadCourseContent();
  </script>
</body>
</html>
