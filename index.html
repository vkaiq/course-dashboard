<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم بالدورة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #333333; color: #ffffff; }
    .custom-card { background-color: #4a4a4a; border: 2px solid #222222; border-radius: 1rem; }
    .inner-card { background-color: #555555; border: 1.5px solid #2b2b2b; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 font-sans">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- القسم العلوي: 3 كروت لاستقبال المحتوى Dynamic -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- كرت الواجبات -->
      <div class="custom-card p-4 space-y-3">
        <div class="bg-[#3b3b3b] text-center py-2 px-4 rounded-full font-bold border border-gray-600">الواجبات</div>
        <div id="assignments-list" class="space-y-3">
          <div class="inner-card p-4 text-center text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>

      <!-- كرت إعلانات الدورة 1 -->
      <div class="custom-card p-4 space-y-3">
        <div class="bg-[#3b3b3b] text-center py-2 px-4 rounded-full font-bold border border-gray-600">إعلانات الدورة 1</div>
        <div id="announcements-1-list" class="space-y-3">
          <div class="inner-card p-4 text-center text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>

      <!-- كرت إعلانات الدورة 2 -->
      <div class="custom-card p-4 space-y-3">
        <div class="bg-[#3b3b3b] text-center py-2 px-4 rounded-full font-bold border border-gray-600">إعلانات الدورة 2</div>
        <div id="announcements-2-list" class="space-y-3">
          <div class="inner-card p-4 text-center text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>

    </div>

    <!-- القسم السفلي: أزرار تسجيلات الأسابيع -->
    <div class="custom-card p-4 space-y-4">
      <div class="bg-[#3b3b3b] text-center py-3 px-6 rounded-full font-bold text-lg border border-gray-600">
        تسجيل الدورة
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div onclick="loadWeekContent(1)" class="inner-card p-8 text-center font-bold text-xl cursor-pointer hover:bg-gray-600 transition">الأسبوع الأول</div>
        <div onclick="loadWeekContent(2)" class="inner-card p-8 text-center font-bold text-xl cursor-pointer hover:bg-gray-600 transition">الأسبوع الثاني</div>
        <div onclick="loadWeekContent(3)" class="inner-card p-8 text-center font-bold text-xl cursor-pointer hover:bg-gray-600 transition">الأسبوع الثالث</div>
        <div onclick="loadWeekContent(4)" class="inner-card p-8 text-center font-bold text-xl cursor-pointer hover:bg-gray-600 transition">الأسبوع الرابع</div>
        <div onclick="loadWeekContent(5)" class="inner-card p-8 text-center font-bold text-xl cursor-pointer hover:bg-gray-600 transition">الأسبوع الخامس</div>
        <div onclick="loadWeekContent(6)" class="inner-card p-8 text-center font-bold text-xl cursor-pointer hover:bg-gray-600 transition">الأسبوع السادس</div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://fyhowaxmmsmflwdiubfs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7h5Md1GNOmy2IDwe2_vvgQ_8641PjaP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchDashboardData() {
      const { data, error } = await supabaseClient
        .from('dashboard_items')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('خطأ في جلب البيانات:', error);
        alert('حدث خطأ أثناء جلب البيانات: ' + error.message);
        return;
      }

      // مصفوفة الأقسام للربط الصحيح مع معرّفات الـ HTML
      const sections = [
        { key: 'assignments', id: 'assignments-list' },
        { key: 'announcements_1', id: 'announcements-1-list' },
        { key: 'announcements_2', id: 'announcements-2-list' }
      ];

      sections.forEach(sec => {
        const container = document.getElementById(sec.id);
        if (!container) return;

        // فلترة العناصر المطابقة للقسم (مع تجاهل الفراغات وحالة الكلمات)
        const filtered = data ? data.filter(item => item.section_type && item.section_type.trim() === sec.key) : [];

        if (filtered.length === 0) {
          container.innerHTML = '<div class="inner-card p-4 text-center text-gray-400 text-sm">لا يوجد محتوى حالياً</div>';
        } else {
          container.innerHTML = filtered.map(item => `
            <div class="inner-card p-4 space-y-2">
              <h4 class="font-bold text-sm text-white">${item.title}</h4>
              ${item.content ? `<p class="text-xs text-gray-300 leading-relaxed">${item.content}</p>` : ''}
              ${item.file_url ? `<a href="${item.file_url}" target="_blank" class="text-xs text-blue-300 underline block font-semibold hover:text-blue-200">📥 تحميل المرفق</a>` : ''}
            </div>
          `).join('');
        }
      });
    }

    async function loadWeekContent(weekNum) {
      const { data, error } = await supabaseClient
        .from('weekly_content')
        .select('*')
        .eq('week_number', weekNum);

      if (error || !data || data.length === 0) {
        alert(`الأسبوع ${weekNum}: لا توجد تسجيلات مضافة حتى الآن.`);
      } else {
        const item = data[0];
        if (item.video_url) {
          window.open(item.video_url, '_blank');
        } else {
          alert(`الأسبوع ${weekNum}: ${item.title}\n${item.description || ''}`);
        }
      }
    }

    fetchDashboardData();
  </script>
</body>
</html>
