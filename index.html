<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم بالدورة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #333333; color: #ffffff; }
    .custom-card { background-color: #4a4a4a; border: 2px solid #222222; border-radius: 1rem; }
    .inner-card { background-color: #555555; border: 1.5px solid #2b2b2b; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 font-sans">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- القسم العلوي: 3 كروت لاستقبال المحتوى Dynamic -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- كرت الواجبات -->
      <div class="custom-card p-4 space-y-3">
        <div class="bg-[#3b3b3b] text-center py-2 px-4 rounded-full font-bold border border-gray-600">الواجبات</div>
        <div id="assignments-list" class="space-y-3">
          <div class="inner-card p-4 text-center text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>

      <!-- كرت إعلانات الدورة 1 -->
      <div class="custom-card p-4 space-y-3">
        <div class="bg-[#3b3b3b] text-center py-2 px-4 rounded-full font-bold border border-gray-600">إعلانات الدورة 1</div>
        <div id="announcements-1-list" class="space-y-3">
          <div class="inner-card p-4 text-center text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>

      <!-- كرت إعلانات الدورة 2 -->
      <div class="custom-card p-4 space-y-3">
        <div class="bg-[#3b3b3b] text-center py-2 px-4 rounded-full font-bold border border-gray-600">إعلانات الدورة 2</div>
        <div id="announcements-2-list" class="space-y-3">
          <div class="inner-card p-4 text-center text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>

    </div>

    <!-- القسم السفلي: أزرار تسجيلات الأسابيع الديناميكية بالكامل -->
    <div class="custom-card p-4 space-y-4">
      <div class="bg-[#3b3b3b] text-center py-3 px-6 rounded-full font-bold text-lg border border-gray-600">
        تسجيل الدورة
      </div>

      <!-- شبكة فارغة تماماً يتم تعبئتها ديناميكياً من قاعدة البيانات حسب إضافة الأدمن -->
      <div id="weekly-buttons-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="inner-card p-4 text-center text-gray-400 text-sm col-span-full">جاري التحميل...</div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://fyhowaxmmsmflwdiubfs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7h5Md1GNOmy2IDwe2_vvgQ_8641PjaP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchDashboardData() {
      // 1. جلب بيانات لوحة المعلومات (الواجبات والإعلانات)
      const { data: dashData, error: dashError } = await supabaseClient
        .from('dashboard_items')
        .select('*')
        .order('created_at', { ascending: false });

      if (!dashError) {
        const sections = [
          { key: 'assignments', id: 'assignments-list' },
          { key: 'announcements_1', id: 'announcements-1-list' },
          { key: 'announcements_2', id: 'announcements-2-list' }
        ];

        sections.forEach(sec => {
          const container = document.getElementById(sec.id);
          if (!container) return;

          const filtered = dashData ? dashData.filter(item => item.section_type && item.section_type.trim() === sec.key) : [];

          if (filtered.length === 0) {
            container.innerHTML = '<div class="inner-card p-4 text-center text-gray-400 text-sm">لا يوجد محتوى حالياً</div>';
          } else {
            container.innerHTML = filtered.map(item => `
              <div class="inner-card p-4 space-y-2">
                <h4 class="font-bold text-sm text-white">${item.title}</h4>
                ${item.content ? `<p class="text-xs text-gray-300 leading-relaxed">${item.content}</p>` : ''}
                ${item.file_url ? `<a href="${item.file_url}" target="_blank" class="text-xs text-blue-300 underline block font-semibold hover:text-blue-200">📥 تحميل المرفق</a>` : ''}
              </div>
            `).join('');
          }
        });
      }

      // 2. جلب الأسابيع المضافة ديناميكياً من جدول المحتوى الأسبوعي
      const { data: weeklyData, error: weeklyError } = await supabaseClient
        .from('weekly_content')
        .select('*')
        .order('week_number', { ascending: true });

      const weeklyGrid = document.getElementById('weekly-buttons-grid');

      if (weeklyError || !weeklyData || weeklyData.length === 0) {
        weeklyGrid.innerHTML = '<div class="inner-card p-4 text-center text-gray-400 text-sm col-span-full">لا توجد تسجيلات متاحة حتى الآن</div>';
        return;
      }

      const uniqueWeeks = [...new Set(weeklyData.map(item => item.week_number))].filter(Boolean).sort((a, b) => a - b);

      if (uniqueWeeks.length === 0) {
        weeklyGrid.innerHTML = '<div class="inner-card p-4 text-center text-gray-400 text-sm col-span-full">لا توجد تسجيلات متاحة حتى الآن</div>';
        return;
      }

      const arabicNumbers = {
        1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع', 5: 'الخامس', 6: 'السادس',
        7: 'السابع', 8: 'الثامن', 9: 'التاسع', 10: 'العاشر', 11: 'الحادي عشر', 12: 'الثاني عشر',
        13: 'الثالث عشر', 14: 'الرابع عشر', 15: 'الخامس عشر', 16: 'السادس عشر', 17: 'السابع عشر', 18: 'الثامن عشر'
      };

      weeklyGrid.innerHTML = uniqueWeeks.map(weekNum => {
        const weekText = arabicNumbers[weekNum] ? `الأسبوع ${arabicNumbers[weekNum]}` : `الأسبوع ${weekNum}`;
        return `
          <div onclick="loadWeekContent(${weekNum})" class="inner-card p-8 text-center font-bold text-xl cursor-pointer hover:bg-gray-600 transition">
            ${weekText}
          </div>
        `;
      }).join('');
    }

    async function loadWeekContent(weekNum) {
      const { data, error } = await supabaseClient
        .from('weekly_content')
        .select('*')
        .eq('week_number', weekNum);

      if (error || !data || data.length === 0) {
        alert(`الأسبوع ${weekNum}: لا توجد تسجيلات مضافة حتى الآن.`);
      } else {
        const item = data[0];
        if (item.video_url) {
          window.open(item.video_url, '_blank');
        } else {
          alert(`الأسبوع ${weekNum}: ${item.title}\n${item.description || ''}`);
        }
      }
    }

    fetchDashboardData();
  </script>
</body>
</html>
