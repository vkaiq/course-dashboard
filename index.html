<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الدورة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #333333; color: #ffffff; }
    .custom-card { background-color: #4a4a4a; border: 2px solid #222222; border-radius: 1rem; }
    .inner-card { background-color: #555555; border: 1.5px solid #2b2b2b; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- 1. عرض قائمة الأسابيع (الصفحة الرئيسية) -->
    <div id="weeks-view" class="custom-card p-6 space-y-6">
      <div class="bg-[#3b3b3b] text-center py-3 px-6 rounded-full font-bold text-xl border border-gray-600">
        تسجيل الدورة
      </div>
      <div id="weeks-container" class="space-y-4">
        <div class="inner-card p-6 text-center text-gray-400 text-sm">جاري تحميل الأسابيع...</div>
      </div>
    </div>

    <!-- 2. عرض تفاصيل المحاضرات ومشغل الفيديو للأسبوع المحدد -->
    <div id="lectures-view" class="space-y-6 hidden">
      
      <!-- زر الرجوع لقائمة الأسابيع -->
      <div>
        <button onclick="showWeeksView()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition flex items-center gap-2">
          ⬅ العودة إلى قائمة الأسابيع
        </button>
      </div>

      <!-- مشغل الفيديو الرئيسي -->
      <div class="custom-card p-6 space-y-4">
        <div id="video-player-container" class="relative w-full aspect-video rounded-xl overflow-hidden border border-gray-700 bg-black flex items-center justify-center">
          <span class="text-gray-400 text-sm">لا يوجد فيديو مرفق لهذه المحاضرة</span>
        </div>
        <div class="inner-card p-4 space-y-2">
          <h2 id="current-lecture-title" class="font-bold text-lg text-yellow-300">عنوان المحاضرة</h2>
          <p id="current-lecture-desc" class="text-sm text-gray-200 leading-relaxed">وصف المحاضرة أو التفاصيل تظهر هنا...</p>
          <div id="current-lecture-file" class="pt-2"></div>
        </div>
      </div>

      <!-- قائمة محاضرات الأسبوع المختار -->
      <div class="custom-card p-6 space-y-6">
        <div id="selected-week-title" class="bg-[#3b3b3b] text-center py-3 px-6 rounded-full font-bold text-xl border border-gray-600">
          المحاضرات
        </div>
        <div id="lectures-container" class="space-y-4">
          <!-- المحاضرات تعبأ تلقائياً -->
        </div>
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://fyhowaxmmsmflwdiubfs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7h5Md1GNOmy2IDwe2_vvgQ_8641PjaP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const arabicNumbers = {
      1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع', 5: 'الخامس', 6: 'السادس',
      7: 'السابع', 8: 'الثامن', 9: 'التاسع', 10: 'العاشر'
    };

    function getWeekLabel(num) {
      return arabicNumbers[num] ? `الأسبوع ${arabicNumbers[num]}` : `الأسبوع ${num}`;
    }

    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('youtube.com/watch?v=')) {
        videoId = url.split('v=')[1]?.split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1]?.split('?')[0];
      }
      return videoId ? `https://www.youtube.com/embed/${videoId}` : '';
    }

    let allWeeklyData = {};

    async function initApp() {
      const { data: weeklyData, error } = await supabaseClient
        .from('weekly_content')
        .select('*')
        .order('id', { ascending: true });

      const weeksContainer = document.getElementById('weeks-container');

      if (error || !weeklyData || weeklyData.length === 0) {
        weeksContainer.innerHTML = `<div class="inner-card p-6 text-center text-gray-400 text-sm">لا توجد تسجيلات متاحة حتى الآن</div>`;
        return;
      }

      // تجميع البيانات حسب الأسبوع
      allWeeklyData = {};
      weeklyData.forEach(item => {
        let wNum = item.week_number || 1;
        if (!allWeeklyData[wNum]) allWeeklyData[wNum] = [];
        allWeeklyData[wNum].push(item);
      });

      let weeksHtml = '';
      Object.keys(allWeeklyData).sort((a, b) => a - b).forEach(wNum => {
        const lectures = allWeeklyData[wNum];
        const weekLabel = getWeekLabel(wNum);

        weeksHtml += `
          <div class="inner-card p-4 space-y-3 border border-gray-600 cursor-pointer hover:border-yellow-400 transition week-card" data-week="${wNum}">
            <div class="font-bold text-yellow-400 text-lg border-b border-gray-600 pb-2 flex justify-between items-center">
              <span>📅 ${weekLabel}</span>
              <span class="text-xs bg-gray-600 px-2.5 py-1 rounded text-white">${lectures.length} محاضرات مسجلة</span>
            </div>
            <div class="space-y-2">
        `;

        lectures.forEach(lec => {
          weeksHtml += `
            <div class="bg-[#3b3b3b] p-3 rounded-lg border border-gray-700">
              <div class="font-bold text-sm text-yellow-300">${lec.title || '(بدون عنوان)'}</div>
              ${lec.description ? `<p class="text-xs text-gray-300 mt-1">${lec.description}</p>` : ''}
            </div>
          `;
        });

        weeksHtml += `</div></div>`;
      });

      weeksContainer.innerHTML = weeksHtml;

      // تفعيل النقر على الأسبوع للانتقال لصفحة المحاضرات الخاصة به
      document.querySelectorAll('.week-card').forEach(card => {
        card.addEventListener('click', () => {
          const wNum = card.getAttribute('data-week');
          openWeekLectures(wNum);
        });
      });
    }

    function openWeekLectures(wNum) {
      const lectures = allWeeklyData[wNum];
      if (!lectures || lectures.length === 0) return;

      document.getElementById('weeks-view').classList.add('hidden');
      document.getElementById('lectures-view').classList.remove('hidden');

      document.getElementById('selected-week-title').textContent = `محاضرات ${getWeekLabel(wNum)}`;

      const lecturesContainer = document.getElementById('lectures-container');
      let html = '';

      lectures.forEach((lec, index) => {
        html += `
          <div class="bg-[#3b3b3b] p-4 rounded-lg flex justify-between items-center border border-gray-700 hover:border-yellow-400 transition cursor-pointer lecture-select-item" data-index="${index}">
            <div>
              <span class="font-bold text-sm text-yellow-300">${lec.title || '(بدون عنوان)'}</span>
              ${lec.description ? `<p class="text-xs text-gray-300 mt-1">${lec.description}</p>` : ''}
            </div>
            <span class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded font-bold shrink-0">عرض المحاضرة ▶</span>
          </div>
        `;
      });

      lecturesContainer.innerHTML = html;

      // عرض أول محاضرة افتراضياً في المشغل
      displayLectureInPlayer(lectures[0]);

      // تفعيل النقر على أي محاضرة لتغيير الفيديو في المشغل
      document.querySelectorAll('.lecture-select-item').forEach(item => {
        item.addEventListener('click', () => {
          const idx = item.getAttribute('data-index');
          displayLectureInPlayer(lectures[idx]);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    function displayLectureInPlayer(lecture) {
      const playerContainer = document.getElementById('video-player-container');
      const titleEl = document.getElementById('current-lecture-title');
      const descEl = document.getElementById('current-lecture-desc');
      const fileEl = document.getElementById('current-lecture-file');

      titleEl.textContent = lecture.title || '(بدون عنوان)';
      descEl.textContent = lecture.description || 'لا يوجد وصف لهذه المحاضرة.';

      const embedUrl = getEmbedUrl(lecture.video_url);
      if (embedUrl) {
        playerContainer.innerHTML = `<iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
      } else if (lecture.video_url) {
        playerContainer.innerHTML = `<a href="${lecture.video_url}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3 rounded-lg text-sm transition">مشاهدة الفيديو الخارجي 🎥</a>`;
      } else {
        playerContainer.innerHTML = `<span class="text-gray-400 text-sm">لا يوجد فيديو مرفق لهذه المحاضرة</span>`;
      }

      if (lecture.file_url) {
        fileEl.innerHTML = `<a href="${lecture.file_url}" target="_blank" class="inline-block bg-green-600 hover:bg-green-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition">تحميل المرفق 📎</a>`;
      } else {
        fileEl.innerHTML = '';
      }
    }

    function showWeeksView() {
      document.getElementById('lectures-view').classList.add('hidden');
      document.getElementById('weeks-view').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initApp();
  </script>
</body>
</html>
