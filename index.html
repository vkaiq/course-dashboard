<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الدورة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #333333; color: #ffffff; }
    .custom-card { background-color: #4a4a4a; border: 2px solid #222222; border-radius: 1rem; }
    .inner-card { background-color: #555555; border: 1.5px solid #2b2b2b; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- قسم مشغل الفيديو الرئيسي للمحاضرة المحددة -->
    <div class="custom-card p-6 space-y-4">
      <div id="video-player-container" class="relative w-full aspect-video rounded-xl overflow-hidden border border-gray-700 bg-black flex items-center justify-center">
        <span class="text-gray-400 text-sm">لا يوجد فيديو مرفق لهذه المحاضرة</span>
      </div>
      <div class="inner-card p-4 space-y-2">
        <h2 id="current-lecture-title" class="font-bold text-lg text-yellow-300">عنوان المحاضرة</h2>
        <p id="current-lecture-desc" class="text-sm text-gray-200 leading-relaxed">وصف المحاضرة أو التفاصيل تظهر هنا...</p>
        <div id="current-lecture-file" class="pt-2"></div>
      </div>
    </div>

    <!-- قسم قائمة المحاضرات مقسمة حسب الأسابيع -->
    <div class="custom-card p-6 space-y-6">
      <div class="bg-[#3b3b3b] text-center py-3 px-6 rounded-full font-bold text-xl border border-gray-600">
        المحاضرات
      </div>
      <div id="weekly-content-container" class="space-y-4">
        <div class="inner-card p-6 text-center text-gray-400 text-sm">جاري تحميل الأسابيع والمحاضرات...</div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://fyhowaxmmsmflwdiubfs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7h5Md1GNOmy2IDwe2_vvgQ_8641PjaP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const arabicNumbers = {
      1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع', 5: 'الخامس', 6: 'السادس',
      7: 'السابع', 8: 'الثامن', 9: 'التاسع', 10: 'العاشر'
    };

    function getWeekLabel(num) {
      return arabicNumbers[num] ? `الأسبوع ${arabicNumbers[num]}` : `الأسبوع ${num}`;
    }

    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('youtube.com/watch?v=')) {
        videoId = url.split('v=')[1]?.split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1]?.split('?')[0];
      }
      return videoId ? `https://www.youtube.com/embed/${videoId}` : '';
    }

    function displayLectureInPlayer(lecture) {
      const playerContainer = document.getElementById('video-player-container');
      const titleEl = document.getElementById('current-lecture-title');
      const descEl = document.getElementById('current-lecture-desc');
      const fileEl = document.getElementById('current-lecture-file');

      titleEl.textContent = lecture.title || '(بدون عنوان)';
      descEl.textContent = lecture.description || 'لا يوجد وصف لهذه المحاضرة.';

      const embedUrl = getEmbedUrl(lecture.video_url);
      if (embedUrl) {
        playerContainer.innerHTML = `<iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
      } else if (lecture.video_url) {
        playerContainer.innerHTML = `<a href="${lecture.video_url}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3 rounded-lg text-sm transition">مشاهدة الفيديو الخارجي 🎥</a>`;
      } else {
        playerContainer.innerHTML = `<span class="text-gray-400 text-sm">لا يوجد فيديو مرفق لهذه المحاضرة</span>`;
      }

      if (lecture.file_url) {
        fileEl.innerHTML = `<a href="${lecture.file_url}" target="_blank" class="inline-block bg-green-600 hover:bg-green-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition">تحميل المرفق 📎</a>`;
      } else {
        fileEl.innerHTML = '';
      }
    }

    async function loadCourseData() {
      const container = document.getElementById('weekly-content-container');

      const { data: weeklyData, error } = await supabaseClient
        .from('weekly_content')
        .select('*')
        .order('id', { ascending: true });

      if (error || !weeklyData || weeklyData.length === 0) {
        container.innerHTML = `<div class="inner-card p-6 text-center text-gray-400 text-sm">لا توجد محاضرات متاحة حتى الآن</div>`;
        return;
      }

      let weeksMap = {};
      weeklyData.forEach(item => {
        let wNum = item.week_number || 1;
        if (!weeksMap[wNum]) weeksMap[wNum] = [];
        weeksMap[wNum].push(item);
      });

      let html = '';
      let firstLecture = null;

      Object.keys(weeksMap).sort((a, b) => a - b).forEach(wNum => {
        const lectures = weeksMap[wNum];
        if (!firstLecture && lectures.length > 0) {
          firstLecture = lectures[0];
        }

        html += `
          <div class="inner-card p-4 space-y-3 border border-gray-600">
            <div class="font-bold text-yellow-400 text-base border-b border-gray-600 pb-2 flex justify-between items-center">
              <span>📅 ${getWeekLabel(wNum)}</span>
              <span class="text-xs bg-gray-600 px-2.5 py-1 rounded text-white">${lectures.length} محاضرات</span>
            </div>
            <div class="space-y-2">
        `;

        lectures.forEach(lec => {
          html += `
            <div class="bg-[#3b3b3b] p-3 rounded-lg flex justify-between items-center border border-gray-700 hover:border-yellow-400 transition cursor-pointer lecture-item" data-id="${lec.id}">
              <span class="font-bold text-sm text-yellow-300">${lec.title || '(بدون عنوان)'}</span>
              <span class="text-xs bg-blue-600 text-white px-3 py-1 rounded font-bold">عرض المحاضرة ▶</span>
            </div>
          `;
        });

        html += `</div></div>`;
      });

      container.innerHTML = html;

      if (firstLecture) {
        displayLectureInPlayer(firstLecture);
      }

      // ربط الحدث لتغيير المحاضرة عند النقر عليها من القائمة
      document.querySelectorAll('.lecture-item').forEach(item => {
        item.addEventListener('click', () => {
          const lecId = item.getAttribute('data-id');
          const selectedLec = weeklyData.find(l => l.id == lecId);
          if (selectedLec) {
            displayLectureInPlayer(selectedLec);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      });
    }

    loadCourseData();
  </script>
</body>
</html>
