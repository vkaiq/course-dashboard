<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض المحاضرات - الطالب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #333333; color: #ffffff; }
    .custom-card { background-color: #4a4a4a; border: 2px solid #222222; border-radius: 1rem; }
    .inner-card { background-color: #555555; border: 1.5px solid #2b2b2b; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- أزرار أو قائمة اختيار الأسابيع -->
    <div class="custom-card p-4">
      <div class="flex gap-2 overflow-x-auto pb-2" id="weeks-tabs-container">
        <!-- تعبأ تلقائياً بالأسابيع المتوفرة -->
      </div>
    </div>

    <!-- قسم عرض الفيديو والمعلومات -->
    <div class="custom-card p-6 space-y-4">
      <div id="video-container" class="w-full bg-black rounded-lg overflow-hidden aspect-video flex items-center justify-center text-gray-400">
        <p>لا يوجد فيديو مرفق لهذه المحاضرة</p>
      </div>

      <div class="inner-card p-4 space-y-2">
        <div id="current-lecture-title" class="font-bold text-yellow-400 text-lg">اختر محاضرة</div>
        <div id="current-lecture-desc" class="text-xs text-gray-300">لا يوجد وصف...</div>
        <div id="current-lecture-file" class="pt-2"></div>
      </div>
    </div>

    <!-- قائمة أزرار المحاضرات للأسبوع المختار -->
    <div class="custom-card p-6 space-y-4">
      <div id="week-header-title" class="font-bold text-yellow-400 text-base border-b border-gray-600 pb-2">قائمة المحاضرات</div>
      <div id="lectures-buttons-list" class="space-y-3">
        <div class="text-gray-400 text-xs py-2 text-center">جاري تحميل المحاضرات...</div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://fyhowaxmmsmflwdiubfs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7h5Md1GNOmy2IDwe2_vvgQ_8641PjaP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const arabicNumbers = {
      1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع', 5: 'الخامس', 6: 'السادس',
      7: 'السابع', 8: 'الثامن', 9: 'التاسع', 10: 'العاشر', 11: 'الحادي عشر', 12: 'الثاني عشر'
    };

    const lectureArabicNumbers = {
      1: 'الأولى', 2: 'الثانية', 3: 'الثالثة', 4: 'الرابعة', 5: 'الخامسة', 
      6: 'السادسة', 7: 'السابعة', 8: 'الثامنة', 9: 'التاسعة', 10: 'العاشرة',
      11: 'الحادية عشرة', 12: 'الثانية عشرة'
    };

    let allWeeklyData = [];
    let currentSelectedWeek = 1;

    function getWeekLabel(num) {
      return arabicNumbers[num] ? `الأسبوع ${arabicNumbers[num]}` : `الأسبوع ${num}`;
    }

    function getLectureLabel(num) {
      return lectureArabicNumbers[num] ? `المحاضرة ${lectureArabicNumbers[num]}` : `المحاضرة ${num}`;
    }

    async function loadStudentContent() {
      const { data: weekly, error } = await supabaseClient
        .from('weekly_content')
        .select('*')
        .order('week_number', { ascending: true })
        .order('id', { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      allWeeklyData = weekly || [];

      let weeks = [...new Set(allWeeklyData.map(item => item.week_number))].sort((a, b) => a - b);
      if (weeks.length === 0) weeks = [1];

      if (!weeks.includes(currentSelectedWeek)) {
        currentSelectedWeek = weeks[0];
      }

      renderWeeksTabs(weeks);
      renderLecturesForWeek(currentSelectedWeek);
    }

    function renderWeeksTabs(weeks) {
      const container = document.getElementById('weeks-tabs-container');
      let html = '';

      weeks.forEach(wNum => {
        const isActive = wNum === currentSelectedWeek;
        const btnClass = isActive 
          ? 'bg-yellow-500 text-black font-bold' 
          : 'bg-[#3b3b3b] text-white hover:bg-[#555555]';

        html += `
          <button onclick="changeWeek(${wNum})" class="px-4 py-2 rounded-lg text-sm transition whitespace-nowrap ${btnClass}">
            ${getWeekLabel(wNum)}
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function changeWeek(wNum) {
      currentSelectedWeek = wNum;
      renderWeeksTabs([...new Set(allWeeklyData.map(item => item.week_number))].sort((a, b) => a - b));
      renderLecturesForWeek(wNum);
    }

    function renderLecturesForWeek(wNum) {
      document.getElementById('week-header-title').innerText = `قائمة محاضرات ${getWeekLabel(wNum)}`;

      const container = document.getElementById('lectures-buttons-list');
      const weekItems = allWeeklyData.filter(item => item.week_number === wNum);

      if (weekItems.length === 0) {
        container.innerHTML = `<div class="text-gray-400 text-xs py-2 text-center">لا توجد محاضرات مضافة لهذا الأسبوع حتى الآن</div>`;
        document.getElementById('video-container').innerHTML = `<p>لا يوجد فيديو مرفق لهذه المحاضرة</p>`;
        document.getElementById('current-lecture-title').innerText = 'اختر محاضرة';
        document.getElementById('current-lecture-desc').innerText = 'لا يوجد وصف...';
        document.getElementById('current-lecture-file').innerHTML = '';
        return;
      }

      let html = '';
      weekItems.forEach((item, index) => {
        const displayTitle = getLectureLabel(index + 1);

        html += `
          <button type="button" onclick='selectLecture(${JSON.stringify(item)}, "${displayTitle}")' class="w-full bg-[#3b3b3b] hover:bg-[#444444] p-4 rounded-lg text-center font-bold text-yellow-400 border border-gray-700 transition shadow">
            ${displayTitle}
          </button>
        `;
      });

      container.innerHTML = html;

      const firstDisplayTitle = getLectureLabel(1);
      selectLecture(weekItems[0], firstDisplayTitle);
    }

    function selectLecture(item, title) {
      document.getElementById('current-lecture-title').innerText = title;
      document.getElementById('current-lecture-desc').innerText = item.description || 'لا يوجد وصف...';

      const videoContainer = document.getElementById('video-container');
      if (item.video_url && item.video_url.trim() !== '') {
        videoContainer.innerHTML = `<iframe src="${item.video_url}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
      } else {
        videoContainer.innerHTML = `<p>لا يوجد فيديو مرفق لهذه المحاضرة</p>`;
      }

      const fileContainer = document.getElementById('current-lecture-file');
      if (item.file_url && item.file_url.trim() !== '') {
        fileContainer.innerHTML = `<a href="${item.file_url}" target="_blank" class="inline-block bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition">تحميل المرفق / الملف 📁</a>`;
      } else {
        fileContainer.innerHTML = '';
      }
    }

    loadStudentContent();
  </script>
</body>
</html>
