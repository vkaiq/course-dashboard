<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة الطالب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #333333; color: #ffffff; }
    .outer-box { background-color: #3f3f3f; border: 2px solid #222222; border-radius: 1rem; }
    .inner-box { background-color: #4a4a4a; border: 2px solid #2b2b2b; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 font-sans">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- الثلاث أعمدة العلوية -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- العمود الأول: إعلانات الدورة -->
      <div class="outer-box p-4 space-y-3">
        <div class="inner-box p-3 text-center font-bold text-sm text-yellow-400">إعلانات الدورة</div>
        <div id="announcements-col-1" class="space-y-2">
          <div class="inner-box p-3 text-xs text-gray-400 text-center">جاري التحميل...</div>
        </div>
      </div>

      <!-- العمود الثاني: إعلانات الدورة -->
      <div class="outer-box p-4 space-y-3">
        <div class="inner-box p-3 text-center font-bold text-sm text-yellow-400">إعلانات الدورة</div>
        <div id="announcements-col-2" class="space-y-2">
          <div class="inner-box p-3 text-xs text-gray-400 text-center">جاري التحميل...</div>
        </div>
      </div>

      <!-- العمود الثالث: الواجبات -->
      <div class="outer-box p-4 space-y-3">
        <div class="inner-box p-3 text-center font-bold text-sm text-yellow-400">الواجبات</div>
        <div id="assignments-col" class="space-y-2">
          <div class="inner-box p-3 text-xs text-gray-400 text-center">لا توجد واجبات حالياً</div>
        </div>
      </div>

    </div>

    <!-- قسم تسجيل الدورة (الأسابيع) -->
    <div class="outer-box p-6 space-y-4">
      <div class="inner-box p-3 text-center font-bold text-base text-yellow-400">تسجيل الدورة</div>
      
      <!-- شبكة أزرار الأسابيع توجيه لصفحة المحاضرات -->
      <div id="weeks-grid-container" class="grid grid-cols-2 md:grid-cols-3 gap-4 pt-2">
        <div class="text-gray-400 text-xs text-center col-span-full py-4">جاري تحميل الأسابيع...</div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://fyhowaxmmsmflwdiubfs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7h5Md1GNOmy2IDwe2_vvgQ_8641PjaP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const arabicNumbers = {
      1: 'الاول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع', 5: 'الخامس', 6: 'السادس',
      7: 'السابع', 8: 'الثامن', 9: 'التاسع', 10: 'العاشر', 11: 'الحادي عشر', 12: 'الثاني عشر'
    };

    async function loadStudentData() {
      const { data: weekly, error: weeklyError } = await supabaseClient
        .from('weekly_content')
        .select('week_number')
        .order('week_number', { ascending: true });

      const { data: dash, error: dashError } = await supabaseClient
        .from('dashboard_items')
        .select('*');

      if (!dashError) renderDashboardItems(dash || []);

      let weeks = [];
      if (!weeklyError && weekly) {
        weeks = [...new Set(weekly.map(item => item.week_number))].sort((a, b) => a - b);
      }
      if (weeks.length === 0) weeks = [1, 2, 3, 4, 5, 6]; // افتراضي

      renderWeeksGrid(weeks);
    }

    function renderDashboardItems(items) {
      const col1 = document.getElementById('announcements-col-1');
      const col2 = document.getElementById('announcements-col-2');
      const col3 = document.getElementById('assignments-col');

      let html1 = '';
      let html2 = '';
      let html3 = '';

      items.forEach(item => {
        const boxHtml = `
          <div class="inner-box p-3 space-y-1">
            <div class="font-bold text-xs text-yellow-300">${item.title || 'إعلان'}</div>
            <p class="text-[11px] text-gray-200">${item.content || ''}</p>
            ${item.file_url ? `<a href="${item.file_url}" target="_blank" class="block text-[10px] text-blue-400 underline pt-1">تحميل المرفق 📁</a>` : ''}
          </div>
        `;

        if (item.section_type === 'announcements') {
          if (!html1) html1 = boxHtml;
          else if (!html2) html2 = boxHtml;
          else html1 += boxHtml;
        } else if (item.section_type === 'assignments') {
          html3 += boxHtml;
        } else {
          html2 += boxHtml;
        }
      });

      col1.innerHTML = html1 || '<div class="inner-box p-3 text-xs text-gray-400 text-center">لا توجد إعلانات</div>';
      col2.innerHTML = html2 || '<div class="inner-box p-3 text-xs text-gray-400 text-center">لا توجد إعلانات إضافية</div>';
      col3.innerHTML = html3 || '<div class="inner-box p-3 text-xs text-gray-400 text-center">لا توجد واجبات حالياً</div>';
    }

    function renderWeeksGrid(weeks) {
      const container = document.getElementById('weeks-grid-container');
      let html = '';

      weeks.forEach(wNum => {
        const weekName = arabicNumbers[wNum] ? `الاسبوع ${arabicNumbers[wNum]}` : `الاسبوع ${wNum}`;
        // يوجهه مباشرة لصفحة المحاضرات ويصحب معه رقم الأسبوع في الرابط
        html += `
          <a href="lectures.html?week=${wNum}" class="inner-box p-4 text-center font-bold text-white hover:bg-[#555] transition h-20 flex items-center justify-center shadow no-underline">
            ${weekName}
          </a>
        `;
      });

      container.innerHTML = html;
    }

    loadStudentData();
  </script>
</body>
</html>
