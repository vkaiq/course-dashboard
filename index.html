<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الدورة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #333333; color: #ffffff; }
    .custom-card { background-color: #4a4a4a; border: 2px solid #222222; border-radius: 1rem; }
    .inner-card { background-color: #555555; border: 1.5px solid #2b2b2b; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 font-sans">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- 1. الصفحة الرئيسية (الأقسام الثلاثة فوق، وأزرار الأسابيع تحت) -->
    <div id="home-view" class="space-y-6">
      
      <!-- الأقسام الثلاثة (إعلانات، إعلانات، واجبات) فوق -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="custom-card p-4 space-y-3">
          <div class="bg-[#3b3b3b] text-center py-2.5 px-4 rounded-full font-bold text-base border border-gray-600">إعلانات الدورة</div>
          <div id="announcements-1-container" class="space-y-2"><div class="inner-card p-3 text-center text-gray-400 text-xs">جاري التحميل...</div></div>
        </div>
        <div class="custom-card p-4 space-y-3">
          <div class="bg-[#3b3b3b] text-center py-2.5 px-4 rounded-full font-bold text-base border border-gray-600">إعلانات الدورة</div>
          <div id="announcements-2-container" class="space-y-2"><div class="inner-card p-3 text-center text-gray-400 text-xs">جاري التحميل...</div></div>
        </div>
        <div class="custom-card p-4 space-y-3">
          <div class="bg-[#3b3b3b] text-center py-2.5 px-4 rounded-full font-bold text-base border border-gray-600">الواجبات</div>
          <div id="assignments-container" class="space-y-2"><div class="inner-card p-3 text-center text-gray-400 text-xs">جاري التحميل...</div></div>
        </div>
      </div>

      <!-- قسم تسسجيل الدورة وأزرار الأسابيع تحت -->
      <div class="custom-card p-6 space-y-6">
        <div class="bg-[#3b3b3b] text-center py-3 px-6 rounded-full font-bold text-xl border border-gray-600">
          تسجيل الدورة
        </div>
        <div id="weeks-grid-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          <div class="inner-card p-6 text-center text-gray-400 text-sm col-span-full">جاري تحميل الأسابيع...</div>
        </div>
      </div>

    </div>

    <!-- 2. صفحة تفاصيل الأسبوع والمحاضرات (تظهر عند النقر على أي أسبوع) -->
    <div id="week-detail-view" class="space-y-6 hidden">
      
      <!-- زر الرجوع -->
      <div>
        <button onclick="showHomeView()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition flex items-center gap-2">
          ⬅ العودة للرئيسية
        </button>
      </div>

      <!-- عنوان الأسبوع -->
      <div class="custom-card p-6 space-y-6">
        <div id="week-header-title" class="bg-[#3b3b3b] text-center py-3 px-6 rounded-full font-bold text-xl border border-gray-600">
          المحاضرات - الأسبوع الأول
        </div>

        <!-- مشغل الفيديو الكبير -->
        <div class="inner-card p-4 space-y-4 border border-gray-600">
          <div id="video-player-container" class="relative w-full aspect-video rounded-xl overflow-hidden border border-gray-700 bg-black flex items-center justify-center">
            <span class="text-gray-400 text-sm">لا يوجد فيديو مرفق لهذه المحاضرة</span>
          </div>
          <div class="bg-[#3b3b3b] p-4 rounded-lg space-y-2 border border-gray-700">
            <h2 id="current-lecture-title" class="font-bold text-base text-yellow-300">عنوان المحاضرة</h2>
            <p id="current-lecture-desc" class="text-xs text-gray-200 leading-relaxed">وصف المحاضرة...</p>
            <div id="current-lecture-file" class="pt-1"></div>
          </div>
        </div>

        <!-- قائمة محاضرات الأسبوع كأزرار متتالية تحت المشغل -->
        <div id="lectures-list-container" class="space-y-3">
          <!-- المحاضرات تعبأ ديناميكياً هنا -->
        </div>
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://fyhowaxmmsmflwdiubfs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7h5Md1GNOmy2IDwe2_vvgQ_8641PjaP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const arabicNumbers = {
      1: 'الاول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع', 5: 'الخامس', 6: 'السادس',
      7: 'السابع', 8: 'الثامن', 9: 'التاسع', 10: 'العاشر'
    };

    function getWeekLabel(num) {
      return arabicNumbers[num] ? `الاسبوع ${arabicNumbers[num]}` : `الاسبوع ${num}`;
    }

    function getEmbedUrl(url) {
      if (!url) return '';
      let videoId = '';
      if (url.includes('youtube.com/watch?v=')) {
        videoId = url.split('v=')[1]?.split('&')[0];
      } else if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1]?.split('?')[0];
      }
      return videoId ? `https://www.youtube.com/embed/${videoId}` : '';
    }

    let allWeeklyData = {};

    async function initApp() {
      // 1. جلب محتوى الأقسام العلوية (الإعلانات والواجبات)
      const { data: dashData } = await supabaseClient.from('dashboard_items').select('*').order('id', { ascending: true });
      if (dashData) {
        let ann1 = '', ann2 = '', assign = '';
        dashData.forEach(item => {
          let card = `<div class="inner-card p-3 space-y-1 border border-gray-700"><div class="font-bold text-xs text-white">${item.title || ''}</div>${item.content ? `<p class="text-[11px] text-gray-300">${item.content}</p>` : ''}</div>`;
          if (item.section_type === 'announcements_1') ann1 += card;
          else if (item.section_type === 'announcements_2') ann2 += card;
          else if (item.section_type === 'assignments') assign += card;
        });
        document.getElementById('announcements-1-container').innerHTML = ann1 || '<div class="inner-card p-3 text-center text-gray-400 text-xs">لا توجد إعلانات</div>';
        document.getElementById('announcements-2-container').innerHTML = ann2 || '<div class="inner-card p-3 text-center text-gray-400 text-xs">لا توجد إعلانات</div>';
        document.getElementById('assignments-container').innerHTML = assign || '<div class="inner-card p-3 text-center text-gray-400 text-xs">لا توجد واجبات</div>';
      }

      // 2. جلب تسجيلات الدورة وتوزيعها على أزرار الأسابيع
      const { data: weeklyData, error } = await supabaseClient.from('weekly_content').select('*').order('id', { ascending: true });
      const weeksGrid = document.getElementById('weeks-grid-container');

      if (error || !weeklyData || weeklyData.length === 0) {
        weeksGrid.innerHTML = `<div class="inner-card p-6 text-center text-gray-400 text-sm col-span-full">لا توجد تسجيلات متاحة</div>`;
        return;
      }

      allWeeklyData = {};
      weeklyData.forEach(item => {
        let wNum = item.week_number || 1;
        if (!allWeeklyData[wNum]) allWeeklyData[wNum] = [];
        allWeeklyData[wNum].push(item);
      });

      let weeksHtml = '';
      Object.keys(allWeeklyData).sort((a, b) => a - b).forEach(wNum => {
        const weekTitle = getWeekLabel(wNum);
        weeksHtml += `
          <div class="inner-card p-6 text-center font-bold text-sm text-white cursor-pointer hover:border-yellow-400 transition flex items-center justify-center min-h-[90px] week-btn" data-week="${wNum}">
            ${weekTitle}
          </div>
        `;
      });

      weeksGrid.innerHTML = weeksHtml;

      // تفعيل النقر على أي أسبوع للانتقال لصفحة المحاضرات الخاصة به
      document.querySelectorAll('.week-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const wNum = btn.getAttribute('data-week');
          openWeekView(wNum);
        });
      });
    }

    function openWeekView(wNum) {
      const lectures = allWeeklyData[wNum];
      if (!lectures || lectures.length === 0) return;

      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('week-detail-view').classList.remove('hidden');

      const weekTitle = getWeekLabel(wNum);
      document.getElementById('week-header-title').textContent = `المحاضرات - ${weekTitle}`;

      // عرض أول محاضرة افتراضياً في المشغل
      displayLectureInPlayer(lectures[0]);

      // بناء قائمة أزرار المحاضرات تحت المشغل
      const listContainer = document.getElementById('lectures-list-container');
      let html = '';

      lectures.forEach((lec, idx) => {
        html += `
          <div class="inner-card p-4 text-center font-bold text-sm text-white cursor-pointer hover:border-yellow-400 transition lecture-select-btn" data-index="${idx}">
            ${lec.title || `المحاضرة ${idx + 1}`}
          </div>
        `;
      });

      listContainer.innerHTML = html;

      // تفعيل النقر على زر المحاضرة لتغيير الفيديو في المشغل العلوي
      document.querySelectorAll('.lecture-select-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = btn.getAttribute('data-index');
          displayLectureInPlayer(lectures[idx]);
        });
      });
    }

    function displayLectureInPlayer(lecture) {
      const playerContainer = document.getElementById('video-player-container');
      const titleEl = document.getElementById('current-lecture-title');
      const descEl = document.getElementById('current-lecture-desc');
      const fileEl = document.getElementById('current-lecture-file');

      titleEl.textContent = lecture.title || '(بدون عنوان)';
      descEl.textContent = lecture.description || 'لا يوجد وصف...';

      const embedUrl = getEmbedUrl(lecture.video_url);
      if (embedUrl) {
        playerContainer.innerHTML = `<iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>`;
      } else if (lecture.video_url) {
        playerContainer.innerHTML = `<a href="${lecture.video_url}" target="_blank" class="bg-blue-600 text-white font-bold px-4 py-2 rounded text-xs">مشاهدة الفيديو 🎥</a>`;
      } else {
        playerContainer.innerHTML = `<span class="text-gray-400 text-sm">لا يوجد فيديو مرفق لهذه المحاضرة</span>`;
      }

      if (lecture.file_url) {
        fileEl.innerHTML = `<a href="${lecture.file_url}" target="_blank" class="inline-block bg-green-600 hover:bg-green-500 text-white font-bold text-xs px-3 py-1.5 rounded transition">تحميل المرفق 📎</a>`;
      } else {
        fileEl.innerHTML = '';
      }
    }

    function showHomeView() {
      document.getElementById('week-detail-view').classList.add('hidden');
      document.getElementById('home-view').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initApp();
  </script>
</body>
</html>
